name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: darwin
            goarch: amd64
            ext: ''
          - goos: darwin
            goarch: arm64
            ext: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags "-s -w" -o phanthycode2api${{ matrix.ext }} ./cmd/server
      - name: Package
        run: |
          dir="phanthycode2api-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir "$dir"
          cp phanthycode2api${{ matrix.ext }} "$dir/"
          cp README.md config.example.json "$dir/"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cp start-server.bat "$dir/"
            zip -r "$dir.zip" "$dir"
          else
            tar -czf "$dir.tar.gz" "$dir"
          fi
      - name: Release notes from tag message
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git for-each-ref "refs/tags/$TAG" --format='%(contents:body)' > RELEASE_NOTES.md
          echo "----------- release notes -----------"
          cat RELEASE_NOTES.md
          echo "-------------------------------------"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: RELEASE_NOTES.md
          files: |
            phanthycode2api-*.zip
            phanthycode2api-*.tar.gz
